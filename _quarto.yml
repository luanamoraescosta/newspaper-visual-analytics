project:
  type: default
  output-dir: docs

resources:
  - dashboard_data.json
  - clusters.json
  - semantic_index.f32
  - semantic_index_metadata.json
  - dashboard.js
  - clusters.js
  - semantic-search.js
  - dashboard_assets/**
  - .nojekyll

execute:
  freeze: auto
  echo: false
  warning: false
  message: false

format:
  dashboard:
    theme:
      - cosmo
      - styles.scss
    orientation: rows
    scrolling: true
    embed-resources: false